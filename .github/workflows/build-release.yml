name: Build and package releases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-client:
    name: Build Angular client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone client repo
        run: git clone https://github.com/IrwinJuice/mimir-client.git client

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build client
        run: |
          cd client
          npm install
          npm run build --if-present

      - name: Upload client-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  build-linux:
    name: Build backend and package (linux)
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download client-dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build backend (Linux)
        run: cargo build --release

      - name: Prepare release folder and package (Linux)
        run: |
          mkdir -p release/linux/web
          # copy client dist contents into release/linux/web
          cp -a client-dist/mimir-clint/*. release/linux/web/
          # copy linux binary (crate name from Cargo.toml)
          cp target/release/mimir-service release/linux/
          # create tar.gz that contains the *contents* of the `linux` folder at the archive root
          tar -czf mimir-linux-x86_64.tar.gz -C release/linux .

      - name: Upload mimir-linux-x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimir-linux-x86_64
          path: mimir-linux-x86_64.tar.gz

  build-windows:
    name: Build backend and package (windows)
    needs: build-client
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download client-dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build backend (Windows)
        run: cargo build --release
        shell: pwsh

      - name: Prepare release folder and package (Windows)
        run: |
          New-Item -ItemType Directory -Path release\web -Force | Out-Null
          # copy all contents of client-dist into release\windows\web
          Copy-Item -Path client-dist\mimir-clint\* -Destination release\web -Recurse -Force
          # copy windows binary
          Copy-Item -Path target\release\mimir-service.exe -Destination release\windows\ -Force
          # compress the *contents* of release\windows into the zip (so files are at archive root)
          Compress-Archive -Path release\windows\* -DestinationPath mimir-windows-x86_64.zip -Force
        shell: pwsh

      - name: Upload release-windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimir-windows-x86_64
          path: mimir-windows-x86_64.zip

